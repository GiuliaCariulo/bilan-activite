name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
      - dev #temporaire
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        # lftp (pile TLS OpenSSL/GnuTLS) plutôt que l'action basée sur Node "basic-ftp",
        # dont l'implémentation TLS échouait à réutiliser la session sur le canal de
        # données ("tlsv1 alert decode error"). Le chiffrement reste actif de bout en bout.
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "
            set ftp:ssl-force true;
            mirror -R --delete --verbose ./_site/ \"$FTP_SERVER_DIR\";
            bye
          " "ftps://$FTP_SERVER"
