local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: src/public/images
public_folder: /public/images

collections:
  - name: parametres
    label: Configuration générale du site
    files:
      - name: config
        label: Configuration générale
        file: src/_data/config.json
        format: json
        fields:
          - { label: Titre, name: titre, widget: string }
          - { label: Organisation, name: organisation, widget: string }
          - { label: Mot du directeur, name: intro_directeur, widget: markdown }
          - { label: Edito, name: intro_edito, widget: markdown }
          - {
              label: Priorités,
              name: priorites,
              widget: list,
              summary: "{{priorite}}",
              field: { label: "Priorité", name: "priorite", widget: text },
            }
          - label: Portfolio
            name: portfolio
            widget: list
            required: false
            fields:
              - label: "Image + légende"
                name: media
                widget: object
                required: false
                hint: "Option A — Remplir uniquement si l'entrée est une image (pas les deux)."
                fields:
                  - {
                      label: Image,
                      name: image,
                      widget: image,
                      required: false,
                    }
                  - {
                      label: Légende,
                      name: legend,
                      widget: string,
                      required: false,
                      hint: "Optionnelle, accompagne l'image.",
                    }
              - {
                  label: Phrase / citation,
                  name: quote,
                  widget: string,
                  required: false,
                  hint: "Option B — Remplir uniquement si l'entrée est une phrase/citation (pas les deux).",
                }
          - label: Partenaires
            name: partners
            summary: "{{title}}"
            widget: list
            required: false
            fields:
              - { label: Nom du partenaire, name: title, widget: string }
              - { label: Image, name: image, widget: image, required: false }
          - {
              label: Ressources,
              name: ressources,
              widget: markdown,
              required: false,
            }

  - name: encadrants
    label: Encadrants
    files:
      - name: encadrants_list
        label: Liste des encadrants
        file: src/_data/encadrants.json
        format: json
        fields:
          - label: Encadrants
            name: encadrants
            widget: list
            summary: "{{nom}}"
            label_singular: "un·e encadrant·e"
            fields:
              - { label: Nom, name: title, widget: string }
              - { label: Titre pro, name: statut, widget: string }
              - { label: Bio, name: bio, widget: string }
              - { label: Image, name: image, widget: image, required: false }

  - name: interns
    label: Stagiaires
    files:
      - name: interns_list
        label: Liste des stagiaires
        file: src/_data/stagiaires.json
        format: json
        fields:
          - label: "Août – décembre"
            name: aout_decembre
            widget: list
            summary: "{{title}}"
            label_singular: "un·e stagiaire"
            fields:
              - { label: Nom, name: title, widget: string }
              - { label: Image, name: image, widget: image, required: false }
          - label: "Janvier – avril"
            name: janvier_avril
            widget: list
            summary: "{{title}}"
            label_singular: "un·e stagiaire"
            fields:
              - { label: Nom, name: title, widget: string }
              - { label: Image, name: image, widget: image, required: false }
          - label: "Avril – juillet"
            name: avril_juillet
            widget: list
            summary: "{{title}}"
            label_singular: "un·e stagiaire"
            fields:
              - { label: Nom, name: title, widget: string }
              - { label: Image, name: image, widget: image, required: false }

  - name: projets
    label: Projets
    label_singular: Projet
    folder: src/_data/projets
    format: json
    extension: json
    identifier_field: title
    slug: "{{title | slugify}}"
    summary: "{{title}}"
    create: true
    fields:
      - { label: Titre du projet, name: title, widget: string }
      - { label: Image de couverture, name: thumbnail, widget: image }
      - { label: "Description", name: description, widget: text }
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - label: Session·s
        name: sessions
        widget: select
        multiple: true
        options: ["Août - décembre", "Janvier - avril", "Avril - Juillet"]
      - label: Type de mandat
        name: mandate
        widget: select
        options: [Communication, Événement, Installation]
      - label: Autres images
        name: images
        widget: list
        required: false
        fields:
          - { label: Image, name: fichier, widget: image }
          - { label: Légende, name: legend, widget: string, required: false }
      - label: Client·e·s
        name: clients
        widget: list
        required: false
        field: { label: Client·e, name: client, widget: string }
      - {
          label: "Compétences mises en œuvre",
          name: skills,
          widget: string,
          required: false,
        }
      - label: Liens
        name: links
        widget: list
        required: false
        fields:
          - { label: Libellé, name: label, widget: string }
          - { label: URL, name: url, widget: string }
